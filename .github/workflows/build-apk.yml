name: Build Medical Sandbox APK

"on":
  workflow_dispatch:
  push:
    paths:
      - 'MedicalSandboxProject.zip.part*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 33
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-33' \
            'build-tools;33.0.2'

      - name: Reassemble project ZIP
        shell: bash
        run: |
          ls -lh MedicalSandboxProject.zip.part*
          cat MedicalSandboxProject.zip.part* > MedicalSandboxProject.zip
          unzip -tq MedicalSandboxProject.zip

      - name: Unpack Medical Sandbox project
        shell: bash
        run: |
          test -f MedicalSandboxProject.zip
          rm -rf build-project
          mkdir build-project
          unzip -q MedicalSandboxProject.zip -d build-project
          PROJECT_DIR="$(find build-project -type f -name gradlew -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'Could not find gradlew inside MedicalSandboxProject.zip'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up and cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo 'Gradle completed but no APK was found.'
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$APK" apk-output/MedicalSandbox-v22.25.1-debug.apk
          ls -lh apk-output/MedicalSandbox-v22.25.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalSandbox-v22.25.1-APK
          path: apk-output/MedicalSandbox-v22.25.1-debug.apk
          if-no-files-found: error
          retention-days: 30
