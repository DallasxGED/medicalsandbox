name: Build Medical Sandbox APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MedicalSandboxProject.zip.part*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Current Android sdkmanager requires Java 17.
      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble Medical Sandbox ZIP
        shell: bash
        run: |
          echo "Finding project ZIP pieces..."

          ls -lh MedicalSandboxProject.zip.part*

          cat MedicalSandboxProject.zip.part* > MedicalSandboxProject.zip

          echo "Reconstructed project ZIP:"
          ls -lh MedicalSandboxProject.zip

          echo "Testing ZIP integrity..."
          unzip -tq MedicalSandboxProject.zip

          echo "ZIP reconstruction successful."

      - name: Unpack project
        shell: bash
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q MedicalSandboxProject.zip -d build-project

          PROJECT_DIR="$(find build-project -type f -name gradlew -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found inside MedicalSandboxProject.zip"
            echo "Files found:"
            find build-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"

          echo "Medical Sandbox project directory:"
          echo "$PROJECT_DIR"

      # AGP requires a namespace. The project application/package namespace
      # is com.medicalcare.game.
      - name: Fix Medical Sandbox Android namespace
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle = project / "app" / "build.gradle"

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle was not found at: " + str(gradle)
              )

          text = gradle.read_text(encoding="utf-8")

          # Detect an existing namespace declaration.
          namespace_pattern = re.compile(
              r'^\s*namespace\s+[\'"][^\'"]+[\'"]',
              re.MULTILINE
          )

          if namespace_pattern.search(text):
              print("Android namespace already exists.")
          else:
              android_pattern = re.compile(r'android\s*\{')

              match = android_pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: Could not find android { block in app/build.gradle"
                  )

              insertion = (
                  text[:match.end()]
                  + "\n    namespace 'com.medicalcare.game'"
                  + text[match.end():]
              )

              gradle.write_text(insertion, encoding="utf-8")

              print("Added:")
              print("namespace 'com.medicalcare.game'")

          print("")
          print("Current app/build.gradle:")
          print("----------------------------------------")
          print(gradle.read_text(encoding="utf-8"))
          print("----------------------------------------")
          PY

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found on the GitHub runner."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "sdkmanager found at:"
          echo "$SDKMANAGER"

      - name: Install Android SDK
        shell: bash
        run: |
          echo "Java used for sdkmanager:"
          java -version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "build-tools;30.0.3"

          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed

      # Medical Sandbox currently uses Gradle 7.3.3 / older AGP,
      # so switch to Java 11 for the actual Android build.
      - name: Set up Java 11 for Medical Sandbox build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Show build environment
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          cd "$PROJECT_DIR"
          ./gradlew --version

          echo ""
          echo "========================================"
          echo "APP BUILD.GRADLE"
          echo "========================================"

          cat app/build.gradle

          echo ""
          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat app/src/main/AndroidManifest.xml

      - name: Build Medical Sandbox APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Starting Medical Sandbox debug APK build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          echo "Looking for generated APK files..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name '*.apk' \
            -print || true

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Gradle finished but no APK was found."

            echo "Build output files:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              | tail -300 || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/MedicalSandbox-v22.25.1-debug.apk"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/MedicalSandbox-v22.25.1-debug.apk"

      - name: Upload Medical Sandbox APK
        uses: actions/upload-artifact@v4
        with:
          name: MedicalSandbox-v22.25.1-APK
          path: apk-output/MedicalSandbox-v22.25.1-debug.apk
          if-no-files-found: error
          retention-days: 30
