name: Build Medical Sandbox APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MedicalSandboxProject.zip.part*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Reassemble Medical Sandbox ZIP
        shell: bash
        run: |
          echo "Project pieces:"
          ls -lh MedicalSandboxProject.zip.part*

          cat MedicalSandboxProject.zip.part* > MedicalSandboxProject.zip

          echo "Rebuilt ZIP:"
          ls -lh MedicalSandboxProject.zip

          unzip -t MedicalSandboxProject.zip

      - name: Unpack project
        shell: bash
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q MedicalSandboxProject.zip -d build-project

          PROJECT_DIR="$(find build-project -type f -name gradlew -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found inside the project ZIP."
            find build-project -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found on the GitHub runner."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager found at $SDKMANAGER"

      - name: Install Android SDK 33
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Show build environment
        shell: bash
        run: |
          java -version
          echo "PROJECT_DIR=$PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build Medical Sandbox debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but no APK was found."
            find "$PROJECT_DIR/app/build" -type f | tail -200 || true
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/MedicalSandbox-v22.25.1-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/MedicalSandbox-v22.25.1-debug.apk"

      - name: Upload Medical Sandbox APK
        uses: actions/upload-artifact@v6
        with:
          name: MedicalSandbox-v22.25.1-APK
          path: apk-output/MedicalSandbox-v22.25.1-debug.apk
          if-no-files-found: error
          retention-days: 30
